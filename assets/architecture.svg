    <g fill="#83a8b5" font-size="13"><text x="163" y="102">paired conditions</text><text x="449" y="102">isolated state</text><text x="735" y="102">policy + audit</text><text x="449" y="228">hash-linked events</text><text x="735" y="228">mission integrity</text><text x="306" y="354">explicit channels</text><text x="592" y="354">state-grounded metrics</text><text x="878" y="354">JSON • MD • HTML</text></g>
