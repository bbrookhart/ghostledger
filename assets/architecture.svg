<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">GHOSTLEDGER architecture</title>
  <desc id="desc">Scenarios and agents enter a synthetic range through a policy-controlled tool gateway. Observable events flow to a tamper-evident ledger, protected oracles, monitors, scoring, and reports.</desc>
