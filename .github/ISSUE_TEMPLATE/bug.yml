name: Bug report
description: Report a reproducible defect in the benchmark harness
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For security-boundary failures, use private vulnerability reporting instead."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, scenario ID, and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
