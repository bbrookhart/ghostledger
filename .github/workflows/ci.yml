name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile and validate repository
        run: make check
      - name: Run test suite
        run: make test
      - name: Run offline demonstration
        run: PYTHONPATH=src python -m ghostledger demo --output /tmp/ghostledger-ci
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build==1.3.0
          python -m build
