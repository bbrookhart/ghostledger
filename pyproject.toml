[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostledger"
version = "0.1.0"
description = "State-grounded evaluation of stealthy sabotage in long-horizon AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Brian Brookhart"}]
keywords = ["ai-security", "agentic-ai", "sabotage-evaluation", "ai-red-teaming", "monitorability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "mypy==1.17.1",
  "ruff==0.12.11",
]

[project.scripts]
ghostledger = "ghostledger.cli:main"

[project.urls]
Homepage = "https://github.com/bbrookhart/ghostledger"
Repository = "https://github.com/bbrookhart/ghostledger"
Issues = "https://github.com/bbrookhart/ghostledger/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghostledger = ["data/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
